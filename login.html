<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In or Register | SpidyWeb</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #07111e 0%, #0a192f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

  <div style="width: 100%; max-width: 480px; background: #ffffff; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); overflow: hidden; padding: 40px 36px;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <a href="index.html" class="logo" style="color: var(--primary-navy); justify-content: center; margin-bottom: 8px;">
        <i class="fas fa-spider" style="color: var(--accent-coral);"></i>
        <span>SpidyWeb</span>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your Indian & global tours in Rupees (₹)</p>
    </div>

    <!-- Toggle Buttons -->
    <div style="display: flex; gap: 8px; margin-bottom: 24px; background: var(--bg-main); padding: 4px; border-radius: var(--radius-full);">
      <button type="button" id="tab-btn-signin" class="btn btn-sm btn-block" style="background: var(--primary-navy); color: #fff;" onclick="switchTab('login')">
        Sign In
      </button>
      <button type="button" id="tab-btn-signup" class="btn btn-sm btn-block" style="background: transparent; color: var(--text-muted);" onclick="switchTab('register')">
        Create Account
      </button>
    </div>

    <!-- Sign In Form -->
    <form id="page-login-form" onsubmit="event.preventDefault(); window.location.href='my-bookings.html';">
      <div class="widget-form-group">
        <label class="widget-label">Email Address</label>
        <input type="email" id="login-email" class="widget-input" placeholder="modik3654@gmail.com" value="modik3654@gmail.com" required>
      </div>

      <div class="widget-form-group">
        <label class="widget-label">Password</label>
        <input type="password" id="login-password" class="widget-input" placeholder="••••••••" value="user123" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
        <i class="fas fa-sign-in-alt"></i> Sign In to SpidyWeb
      </button>

      <!-- Quick Demo Access Badges for Presentation -->
      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px dashed var(--border-light); text-align: center;">
        <p style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;">
          <i class="fas fa-magic"></i> 1-Click Faculty Demo Credentials
        </p>
        <div style="display: flex; gap: 8px; justify-content: center;">
          <button type="button" class="badge badge-teal" style="cursor: pointer; padding: 6px 12px; font-size: 0.8rem;" onclick="fillCreds('modik3654@gmail.com', 'user123', 'customer')">
            <i class="fas fa-user"></i> Krrish Modi (Customer)
          </button>
          <button type="button" class="badge badge-coral" style="cursor: pointer; padding: 6px 12px; font-size: 0.8rem;" onclick="fillCreds('modik3654@gmail.com', 'admin123', 'admin')">
            <i class="fas fa-user-shield"></i> Krrish Modi (Admin)
          </button>
        </div>
      </div>
    </form>

    <!-- Sign Up Form -->
    <form id="page-register-form" style="display: none;" onsubmit="event.preventDefault(); alert('Account successfully created! Welcome to SpidyWeb, Krrish Modi.'); window.location.href='my-bookings.html';">
      <div class="widget-form-group">
        <label class="widget-label">Full Name</label>
        <input type="text" class="widget-input" value="Krrish Modi" required>
      </div>

      <div class="widget-form-group">
        <label class="widget-label">Email Address</label>
        <input type="email" class="widget-input" value="modik3654@gmail.com" required>
      </div>

      <div class="widget-form-group">
        <label class="widget-label">Password</label>
        <input type="password" class="widget-input" placeholder="Min 6 characters" value="user123" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
        <i class="fas fa-user-plus"></i> Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-arrow-left"></i> Return to SpidyWeb Home</a>
    </div>
  </div>

  <script>
  function switchTab(type) {
    const loginForm = document.getElementById('page-login-form');
    const registerForm = document.getElementById('page-register-form');
    const btnLogin = document.getElementById('tab-btn-signin');
    const btnRegister = document.getElementById('tab-btn-signup');

    if (type === 'login') {
      loginForm.style.display = 'block';
      registerForm.style.display = 'none';
      btnLogin.style.background = 'var(--primary-navy)';
      btnLogin.style.color = '#fff';
      btnRegister.style.background = 'transparent';
      btnRegister.style.color = 'var(--text-muted)';
    } else {
      loginForm.style.display = 'none';
      registerForm.style.display = 'block';
      btnRegister.style.background = 'var(--primary-navy)';
      btnRegister.style.color = '#fff';
      btnLogin.style.background = 'transparent';
      btnLogin.style.color = 'var(--text-muted)';
    }
  }

  function fillCreds(email, pass, role) {
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').value = pass;
    if (role === 'admin') {
      document.getElementById('page-login-form').onsubmit = (e) => {
        e.preventDefault();
        window.location.href = 'admin/index.html';
      };
    } else {
      document.getElementById('page-login-form').onsubmit = (e) => {
        e.preventDefault();
        window.location.href = 'my-bookings.html';
      };
    }
  }
  </script>
</body>
</html>
